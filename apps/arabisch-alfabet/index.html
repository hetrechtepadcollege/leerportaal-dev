<!DOCTYPE html>
<html lang="nl" dir="ltr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://hetrechtepadcollege.goatcounter.com;">
    <title>Arabisch Alfabet | Het Rechte Pad College</title>
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://leer.hetrechtepadcollege.nl/apps/arabisch-alfabet/">
    <meta property="og:title" content="Arabisch Alfabet — Leer de 28 letters">
    <meta property="og:description" content="Leer interactief de 28 letters van het Arabisch alfabet met uitleg en een quiz.">
    <meta property="og:image" content="https://leer.hetrechtepadcollege.nl/images/share-banner.png">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Arabisch Alfabet — Leer de 28 letters">
    <meta property="twitter:description" content="Leer interactief de 28 letters van het Arabisch alfabet met uitleg en een quiz.">
    <meta property="twitter:image" content="https://leer.hetrechtepadcollege.nl/images/share-banner.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <img src="../../images/HRPC-logo.png" alt="Het Rechte Pad College" class="header-logo">
        <a href="../../" class="back-btn">← Terug naar Portal</a>
        <h1 class="header-title">Arabisch Alfabet</h1>
        <p class="header-subtitle">Leer de 28 letters van het Arabische alfabet</p>
        <div class="header-progress">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <span class="progress-label" id="progressLabel">0 / 28 geleerd</span>
        </div>
    </header>
    <main class="app-main">
        <nav class="tab-nav" role="tablist" aria-label="Modi">
            <button class="tab-btn active" data-tab="verkennen" role="tab">📖 Verkennen</button>
            <button class="tab-btn" data-tab="quiz" role="tab">🎯 Quiz</button>
        </nav>
        <!-- VERKENNEN TAB -->
        <section class="tab-panel active" id="tab-verkennen">
            <div class="letters-grid" id="lettersGrid"></div>
            <div class="letter-detail card hidden" id="letterDetail">
                <div class="detail-header">
                    <div class="detail-arabic" id="detailArabic"></div>
                    <div class="detail-meta">
                        <h2 id="detailName"></h2>
                        <p id="detailRoman"></p>
                        <p class="detail-sound" id="detailSound"></p>
                    </div>
                </div>
                <div class="forms-grid" id="detailForms"></div>
            </div>
        </section>
        <!-- QUIZ TAB -->
        <section class="tab-panel" id="tab-quiz">
            <div class="quiz-score-row">
                <span class="score-pill score-correct">✓ <span id="scoreGoed">0</span> goed</span>
                <span class="score-pill score-wrong">✗ <span id="scoreFout">0</span> fout</span>
            </div>
            <div class="card quiz-card">
                <div class="quiz-letter" id="quizLetter"></div>
                <p class="quiz-prompt">Welke letter is dit?</p>
                <div class="quiz-options" id="quizOptions"></div>
                <p class="quiz-feedback" id="quizFeedback"></p>
                <button class="btn-primary hidden" id="quizVolgende" onclick="volgendeVraag()">Volgende →</button>
            </div>
        </section>
    </main>
    <footer class="app-footer">
        <p>© 2026 Het Rechte Pad College</p>
        <a href="https://www.hetrechtepad.nl" target="_blank" rel="noopener noreferrer" class="footer-link">www.hetrechtepad.nl</a>
    </footer>
</div>
<script src="script.js"></script>
<script data-goatcounter="https://hetrechtepadcollege.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"
        integrity="sha384-DGiREytotlUiLflu8vLo0vvfxKWn36pKPT1ZBhh3R+3vhwrS/4p3H9eys9Zr2bPQ"
        crossorigin="anonymous"></script>
</body>
</html>
