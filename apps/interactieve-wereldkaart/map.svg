<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 1000 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .land { fill: #e8e3da; stroke: #d1ccc3; stroke-width: 0.5; transition: fill 0.6s ease; }
      .land.active { fill: #c8ddd0; }
      .water { fill: #dce8f0; }
      .marker { opacity: 0; transition: opacity 0.5s ease; }
      .marker.visible { opacity: 1; }
      .marker-dot { fill: #1a6b4a; }
      .marker-ring { fill: none; stroke: #1a6b4a; stroke-width: 1.5; }
      @keyframes pulse { 0%,100%{ r:6; opacity:.4 } 50%{ r:10; opacity:0 } }
      .marker-pulse { fill: #1a6b4a; animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Water background -->
  <rect class="water" x="0" y="0" width="1000" height="600"/>

  <!-- === LANDMASSES (simplified polygons) === -->

  <!-- EUROPE -->
  <!-- Iberian Peninsula (Spain/Portugal) -->
