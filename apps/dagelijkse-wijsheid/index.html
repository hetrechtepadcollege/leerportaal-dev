<!DOCTYPE html>
<html lang="nl" dir="ltr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/icons/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
    <link rel="icon" type="image/png" href="/icons/favicon-96x96.png" sizes="96x96">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://hetrechtepadcollege.goatcounter.com;">
    <title>Dagelijkse Wijsheid | Het Rechte Pad College</title>

    <meta property="og:type" content="article">
    <meta property="og:url" content="https://leer.hetrechtepadcollege.nl/apps/dagelijkse-wijsheid/">
    <meta property="og:title" content="Dagelijkse Wijsheid — Elke dag een nieuwe wijsheid">
    <meta property="og:description" content="Elke dag een inspirerend vers, ḥadīth of wijsheid van een geleerde. Deel het als afbeelding.">
    <meta property="og:image" content="https://leer.hetrechtepadcollege.nl/images/share-banner.png">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Dagelijkse Wijsheid — Elke dag een nieuwe wijsheid">
    <meta property="twitter:description" content="Elke dag een inspirerend vers, ḥadīth of wijsheid van een geleerde.">
    <meta property="twitter:image" content="https://leer.hetrechtepadcollege.nl/images/share-banner.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

    <!-- Header -->
    <header class="app-header">
        <a href="/" class="back-link" aria-label="Terug naar het leerportaal">←</a>
        <div class="header-text">
            <h1 class="header-title">Dagelijkse Wijsheid</h1>
            <p class="header-subtitle">Elke dag een nieuw inzicht</p>
        </div>
    </header>

    <!-- Date navigation -->
    <div class="date-nav">
        <button class="nav-btn" id="prevBtn" aria-label="Vorige dag">‹</button>
        <div class="date-center">
            <span class="date-label" id="dateLabel"></span>
            <button class="today-btn" id="todayBtn" style="display:none">Vandaag</button>
        </div>
        <button class="nav-btn" id="nextBtn" aria-label="Volgende dag">›</button>
    </div>

    <!-- Wisdom card -->
    <div class="wisdom-card" id="wisdomCard">
        <span class="type-badge" id="typeBadge"></span>

        <p class="arabic-text" id="arabicText" dir="rtl" lang="ar"></p>

        <blockquote class="dutch-text" id="dutchText"></blockquote>

        <p class="source-text" id="sourceText"></p>
        <p class="scholar-name" id="scholarName" style="display:none"></p>
    </div>

    <!-- Context -->
    <div class="context-box" id="contextBox">
        <p class="context-text" id="contextText"></p>
    </div>

    <!-- Share button -->
    <button class="share-btn" id="shareBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/>
            <polyline points="16 6 12 2 8 6"/>
            <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
        Deel als afbeelding
    </button>

</div>

<!-- Hidden logo for canvas export -->
<img id="brandLogo" src="images/HRPC-logo-white.png" alt="" style="display:none" crossorigin="anonymous">

<script src="script.js"></script>

<script data-goatcounter="https://hetrechtepadcollege.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"
        integrity="sha384-DGiREytotlUiLflu8vLo0vvfxKWn36pKPT1ZBhh3R+3vhwrS/4p3H9eys9Zr2bPQ"
        crossorigin="anonymous"></script>

</body>
</html>
